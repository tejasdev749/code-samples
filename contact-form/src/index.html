<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angular app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body ng-app="videoApp">
    <div ng-controller="VideoController">
      <table>
        <thead>
          <th>Title</th>
          <th>Length</th>
          <th></th>
        </thead>
        <tbody>
          <tr data-id="{{video.id}}" ng-repeat="video in videos">
            <td>{{video.title}}</td>
            <td>{{video.length}}</td>
          </tr>
        </tbody>
      </table>
      <button ng-click="showEdit()">Show Edit</button>
            <button ng-click="dismiss()">Dismiss</button>
      <div ng-show="isEditVisible">
        <form ng-submit="saveVideo()">
            <hr/>
            <input type="hidden" name="id" value=""/>
            <div>
            <label for="title">Title:</label>
            <input type="text" ng-model="newVideo.title" required/>
            </div>
            <div>
                <label for="length">Length</label>
                <input type="number" ng-model="newVideo.length" min="1" max="360s"/>
            </div>
            <input type="submit" value="Submit"/>
        </form>
      </div>
    </div>
     <!-- AngularJS 1.x CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="app.js"></script>
  <script src="./controllers/videoController.js"></script>

  </body>
</html>
