<div class="container-fluid">
    <div class="row">
        <div class="col-md-2">


            <p>Search: <input ng-model="$ctrl.query" /></p>
            <p>
            Order By: <select ng-model="$ctrl.orderProp">
                <option value="name">Alpabetically</option>
                <option value="age">Newest</option>
            </select>
            </p>
        </div>
        <div class="col-md-10">
            <!--Body content-->

            <ul class="phones">
                <li ng-repeat="phone in $ctrl.phones | filter:$ctrl.query | orderBy:$ctrl.orderProp">
                    <span>{{phone.name}}</span>
                    <p>{{phone.snippet}}</p>
                </li>
            </ul>
            </div>
    </div>
</div>
